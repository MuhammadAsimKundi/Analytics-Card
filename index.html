<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Card</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body>
    <div class="card">
            <!-- header -->
        <div class="header">
            <span>⬛</span>
            <h3>ANALYTICS</h3>
            <p>last 30 days</p>
        </div>

        <!-- Main section -->
         <div class="main">
            <div class="right-main"></div>
            <div class="left-main">
                <h1>18,240</h1>
                <p>sessions</p>
            </div>
         </div>
        <!-- footer section -->
         <div class="footer">
            <div class="dot">
                <p class="dot-clr"></p>
            </div>
            <label for="#">Label</label>
            <p>$18,240</p>
            <span class="arrow">&#8663;</span>
         </div>
    </div>
    
</body>
</html>
